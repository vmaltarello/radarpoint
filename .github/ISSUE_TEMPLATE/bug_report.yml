name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or HTTP request you ran, and what you got.
      placeholder: |
        radarpoint --product SRI --lat 45.5966 --lon 8.915
        radarpoint: …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash or release, and the output of `go version`.
